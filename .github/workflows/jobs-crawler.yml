name: Stellenanzeigen crawlen

on:
  schedule:
    # täglich um 05:17 UTC (≈ 06:17/07:17 Uhr deutscher Zeit)
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "jobs/crawl.mjs"
      - "jobs/regional.mjs"
      - "jobs/template.html"
      - "jobs/config.json"
      - ".github/workflows/jobs-crawler.yml"

permissions:
  contents: write

concurrency:
  group: jobs-crawler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stellen crawlen und HTML erzeugen
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node jobs/crawl.mjs

      - name: Ergebnis als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: stellenanzeigen
          path: docs/

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ jobs/drive-cache.json jobs/geo-cache.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Stellenanzeigen aktualisiert ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
